<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">DocSign — Digital document signing platform</title>
  <desc id="desc">DocSign interface showing a signed PDF document dashboard with upload, sign, and track workflow. Split layout with project name on the left and document signing preview on the right.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F15"/>
      <stop offset="100%" stop-color="#141A24"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1EB4EB"/>
      <stop offset="100%" stop-color="#4FC8F0"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2233"/>
      <stop offset="100%" stop-color="#161E2D"/>
    </linearGradient>
    <linearGradient id="doc-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="sig-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1EB4EB"/>
      <stop offset="100%" stop-color="#4FC8F0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bg-grad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="72" x2="1200" y2="72"/>
    <line x1="0" y1="144" x2="1200" y2="144"/>
    <line x1="0" y1="216" x2="1200" y2="216"/>
    <line x1="0" y1="288" x2="1200" y2="288"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- ==================== LEFT PANEL: Title ==================== -->
  <g transform="translate(56, 0)">

    <!-- Badge -->
    <rect x="0" y="48" width="80" height="24" rx="12" fill="#1EB4EB" fill-opacity="0.12"/>
    <text x="40" y="64" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="600" fill="#4FC8F0" letter-spacing="0.5">v0.1</text>

    <!-- Project name -->
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="52" font-weight="700" fill="#F1F5F9" letter-spacing="-1">
      Doc<tspan fill="#4FC8F0">Sign</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="16" font-weight="400" fill="#94A3B8">
      Send, sign, and track documents online
    </text>

    <!-- Description -->
    <text x="0" y="186" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="14" font-weight="400" fill="#64748B" line-height="1.5">
      <tspan x="0" dy="0">Upload PDFs, add signers, place signature fields,</tspan>
      <tspan x="0" dy="22">and get documents signed — no printing needed.</tspan>
    </text>

    <!-- Workflow steps -->
    <g transform="translate(0, 240)">
      <!-- Step 1 -->
      <circle cx="8" cy="8" r="8" fill="#1EB4EB" fill-opacity="0.15"/>
      <text x="8" y="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" font-weight="600" fill="#4FC8F0">1</text>
      <text x="28" y="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="13" font-weight="500" fill="#CBD5E1">Upload &amp; add signers</text>

      <!-- Step 2 -->
      <circle cx="8" cy="38" r="8" fill="#1EB4EB" fill-opacity="0.15"/>
      <text x="8" y="43" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" font-weight="600" fill="#4FC8F0">2</text>
      <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="13" font-weight="500" fill="#CBD5E1">Sign in seconds on any device</text>

      <!-- Step 3 -->
      <circle cx="8" cy="68" r="8" fill="#1EB4EB" fill-opacity="0.15"/>
      <text x="8" y="73" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" font-weight="600" fill="#4FC8F0">3</text>
      <text x="28" y="73" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="13" font-weight="500" fill="#CBD5E1">Track, store &amp; download</text>
    </g>

    <!-- Metadata row -->
    <g transform="translate(0, 336)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#1EB4EB" fill-opacity="0.3"/>
      <text x="18" y="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#475569">Next.js 16</text>
      <circle cx="88" cy="5" r="2" fill="#334155"/>
      <text x="98" y="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#475569">TypeScript</text>
      <circle cx="168" cy="5" r="2" fill="#334155"/>
      <text x="178" y="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#475569">Supabase</text>
      <circle cx="246" cy="5" r="2" fill="#334155"/>
      <text x="256" y="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#475569">shadcn/ui</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: Document Preview ==================== -->
  <g transform="translate(586, 32)">

    <!-- Document card -->
    <rect x="0" y="0" width="558" height="296" rx="14" fill="url(#card-grad)" filter="url(#shadow)" stroke="#1E293B" stroke-width="1"/>

    <!-- Card header -->
    <rect x="14" y="14" width="530" height="36" rx="8" fill="#1E293B"/>
    <rect x="24" y="24" width="16" height="16" rx="3" fill="#1EB4EB" fill-opacity="0.2"/>
    <text x="46" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="13" font-weight="600" fill="#94A3B8">Sales Agreement — Review &amp; Sign</text>
    <!-- Status badge -->
    <rect x="446" y="21" width="88" height="22" rx="11" fill="#22C55E" fill-opacity="0.12"/>
    <circle cx="458" cy="32" r="3" fill="#22C55E"/>
    <text x="466" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" font-weight="600" fill="#4ADE80">Pending</text>

    <!-- Document page -->
    <g transform="translate(79, 66)">
      <rect x="0" y="0" width="400" height="210" rx="6" fill="url(#doc-grad)"/>
      <!-- Document lines (text simulation) -->
      <rect x="24" y="24" width="160" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="24" y="38" width="352" height="5" rx="2.5" fill="#E2E8F0"/>
      <rect x="24" y="49" width="352" height="5" rx="2.5" fill="#E2E8F0"/>
      <rect x="24" y="60" width="300" height="5" rx="2.5" fill="#E2E8F0"/>

      <rect x="24" y="80" width="120" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="24" y="94" width="352" height="5" rx="2.5" fill="#E2E8F0"/>
      <rect x="24" y="105" width="352" height="5" rx="2.5" fill="#E2E8F0"/>
      <rect x="24" y="116" width="200" height="5" rx="2.5" fill="#E2E8F0"/>

      <rect x="24" y="136" width="100" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="24" y="150" width="352" height="5" rx="2.5" fill="#E2E8F0"/>
      <rect x="24" y="161" width="280" height="5" rx="2.5" fill="#E2E8F0"/>

      <!-- Signature field box -->
      <rect x="24" y="180" width="180" height="24" rx="4" fill="#1EB4EB" fill-opacity="0.08"
            stroke="#1EB4EB" stroke-width="1" stroke-dasharray="4 3"/>
      <path d="M28,196 C48,186 60,196 80,188 C95,182 115,196 140,186 C155,180 170,196 195,188"
            fill="none" stroke="url(#sig-line)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
      <text x="24" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="8" fill="#1EB4EB" font-weight="500">SIGN HERE</text>
    </g>

    <!-- Bottom bar (signer info) -->
    <g transform="translate(14, 292)">
      <rect x="0" y="-12" width="530" height="1" fill="#1E293B"/>
      <circle cx="12" cy="6" r="5" fill="#4FC8F0" fill-opacity="0.3"/>
      <text x="24" y="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="12" fill="#64748B">Sent to: <tspan fill="#CBD5E1" font-weight="500">alex@example.com</tspan></text>
      <text x="430" y="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#475569">Expires in 7 days</text>
    </g>

  </g>

</svg>
